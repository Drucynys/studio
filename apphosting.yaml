# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Settings for Cloud Run
runConfig:
  minInstances: 0
  maxInstances: 100
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  timeoutSeconds: 900

# Environment variables and secrets
env:
  - variable: FIREBASE_PROJECT_ID
    value: pokdex-tracker-mjjbo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_POKEMONTCG_API_KEY
    secret: firebase-client-api-key

  - variable: GOOGLE_APPLICATION_CREDENTIALS_JSON
    secret: google-creds-final
    availability:
      - BUILD
      - RUNTIME

  # ADD THESE FIREBASE CLIENT VARIABLES:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCs2IWCbkVY8Md1X0k6k12LCVuny4Nplc8
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: pokdex-tracker-mjjbo.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: pokdex-tracker-mjjbo
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: pokdex-tracker-mjjbo.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 430361704452
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:430361704452:web:c27505e6c9816e70e49d51
    availability:
      - BUILD
      - RUNTIME
